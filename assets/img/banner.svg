<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" preserveAspectRatio="xMaxYMid slice">
<style>
/* Each shape is drawn around its own origin inside a positioning group, so these
   transforms rotate it in place without needing transform-origin. The page serves
   banner-static.svg instead when the reader asks for reduced motion. */
.m { animation: 22s ease-in-out infinite alternate; }
@keyframes float1 {
  from { transform: translate(4px, -2px) rotate(9deg); }
  to   { transform: translate(-4px, 2px) rotate(-9deg); }
}
@keyframes float2 {
  from { transform: translate(-3.5px, -3px) rotate(-7deg); }
  to   { transform: translate(3.5px, 3px) rotate(7deg); }
}
@keyframes float3 {
  from { transform: translate(3px, 3.5px) rotate(-10deg); }
  to   { transform: translate(-3px, -3.5px) rotate(10deg); }
}
@keyframes float4 {
  from { transform: translate(-4.5px, 1.5px) rotate(7deg); }
  to   { transform: translate(4.5px, -1.5px) rotate(-7deg); }
}
@keyframes float5 {
  from { transform: translate(-2.5px, -4px) rotate(11deg); }
  to   { transform: translate(2.5px, 4px) rotate(-11deg); }
}
@keyframes float6 {
  from { transform: translate(4.5px, 1px) rotate(-6deg); }
  to   { transform: translate(-4.5px, -1px) rotate(6deg); }
}
@keyframes swim1 {
  from { transform: translate(-5px, .6px); }
  to   { transform: translate(5px, -.6px); }
}
@keyframes swim2 {
  from { transform: translate(-3.5px, -1px); }
  to   { transform: translate(3.5px, 1px); }
}
@keyframes swim3 {
  from { transform: translate(-6px, 0); }
  to   { transform: translate(6px, 0); }
}
.m.a1 { animation-name: swim2; animation-duration: 43s; animation-delay: -15s; }
.m.a2 { animation-name: swim3; animation-duration: 35s; animation-delay: -35s; }
.m.a3 { animation-name: swim1; animation-duration: 32s; animation-delay: -20s; }
.m.a4 { animation-name: swim2; animation-duration: 54s; animation-delay: -3s; }
.m.a5 { animation-name: swim3; animation-duration: 45s; animation-delay: -25s; }
.m.a6 { animation-name: swim1; animation-duration: 33s; animation-delay: -15s; }
.m.a7 { animation-name: swim2; animation-duration: 49s; animation-delay: -18s; }
.m.a8 { animation-name: swim3; animation-duration: 49s; animation-delay: -6s; }
.m.b1 { animation-name: float2; animation-duration: 38s; animation-delay: -4s; }
.m.b2 { animation-name: float3; animation-duration: 44s; animation-delay: -37s; }
.m.b3 { animation-name: float4; animation-duration: 46s; animation-delay: -31s; }
.m.b4 { animation-name: float5; animation-duration: 41s; animation-delay: -30s; }
.m.b5 { animation-name: float6; animation-duration: 34s; animation-delay: -12s; }
.m.b6 { animation-name: float1; animation-duration: 48s; animation-delay: -29s; }
.m.b7 { animation-name: float2; animation-duration: 42s; animation-delay: -4s; }
.m.b8 { animation-name: float3; animation-duration: 38s; animation-delay: -8s; }

.daughter       { animation: 100s linear infinite; }
.daughter.right { animation-name: divideRight; }
.daughter.down  { animation-name: divideDown; animation-delay: -50s; }
.mother         { animation: mother 100s linear infinite; }
.mother { animation: none !important; }
.mother.down    { animation-delay: -50s; }
@keyframes divideRight {
  0%, 30%  { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
  40%   { transform: translate(9px, 0) scale(.62) rotate(0deg); opacity: 1; }
  52%   { transform: translate(14px, 0) scale(1) rotate(0deg); opacity: 1; }
  60%   { transform: translate(20px, 0.4px) scale(1) rotate(6deg); opacity: 1; }
  65%   { transform: translate(29px, 2.2px) scale(1) rotate(18deg); opacity: 1; }
  69%   { transform: translate(38px, 6.1px) scale(1) rotate(26deg); opacity: 1; }
  74%   { transform: translate(47px, 8.5px) scale(1) rotate(0deg); opacity: 1; }
  78%   { transform: translate(56px, 8.6px) scale(1) rotate(-0deg); opacity: 1; }
  83%   { transform: translate(66px, 8.1px) scale(1) rotate(-14deg); opacity: 1; }
  87%   { transform: translate(75px, 4.7px) scale(1) rotate(-20deg); }
  92%   { transform: translate(84px, 3.9px) scale(1) rotate(10deg); }
  96%   { transform: translate(93px, 5.4px) scale(1) rotate(-8deg); opacity: 0; }
  100%  { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0; }
}
@keyframes divideDown {
  0%, 30%  { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
  40%   { transform: translate(9px, 0) scale(.62) rotate(0deg); opacity: 1; }
  52%   { transform: translate(14px, 0) scale(1) rotate(0deg); opacity: 1; }
  60%   { transform: translate(17px, 0.0px) scale(1) rotate(3deg); opacity: 1; }
  65%   { transform: translate(21px, 0.4px) scale(1) rotate(6deg); opacity: 1; }
  69%   { transform: translate(25px, 1.0px) scale(1) rotate(15deg); opacity: 1; }
  74%   { transform: translate(30px, 2.7px) scale(1) rotate(22deg); opacity: 1; }
  78%   { transform: translate(34px, 4.5px) scale(1) rotate(24deg); opacity: 1; }
  83%   { transform: translate(39px, 6.7px) scale(1) rotate(24deg); opacity: 1; }
  87%   { transform: translate(43px, 8.5px) scale(1) rotate(24deg); }
  92%   { transform: translate(47px, 9.0px) scale(1) rotate(22deg); }
  96%   { transform: translate(52px, 9.0px) scale(1) rotate(20deg); opacity: 0; }
  100%  { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0; }
}
@keyframes mother {
  0%, 30%  { transform: scale(1); }
  40%      { transform: scale(.62); }
  52%, 100% { transform: scale(1); }
}
</style>
